<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор</title>
    <link rel="stylesheet" href="../src/App.css">
</head>
<body>
    <header class="header">
        <h1><a href="/">Рецепты</a></h1>
        <nav>
            <a href="/">Все рецепты</a>
            <a href="/my-recipes">Мои рецепты</a>
            <a href="/constructor">Конструктор</a>
            <a href="/create-recipe">Создать</a>
            <button class="btn-logout">Выйти</button>
        </nav>
    </header>
    <main>
        <div class="constructor-page">
            <h1>Конструктор рецептов</h1>
            <div class="constructor-layout">
                <aside class="ingredients-panel">
                    <h3>Ингредиенты</h3>
                    <p>Нажмите на ингредиент чтобы добавить/убрать</p>
                    <div class="ingredients-grid">
                        <div class="ingredient-tag">Куриная грудка</div>
                        <div class="ingredient-tag">Рис</div>
                        <div class="ingredient-tag">Морковь</div>
                        <div class="ingredient-tag">Лук репчатый</div>
                        <div class="ingredient-tag">Масло растительное</div>
                    </div>
                    <div class="selected-count">
                        Выбрано: <span id="selectedCount">0</span>
                        <button id="searchBtn" class="btn btn-primary" disabled>Найти рецепты</button>
                    </div>
                </aside>
                <section class="results-panel">
                    <h3>Результаты</h3>
                    <p id="resultsHint">Выберите ингредиенты слева</p>
                    <div class="recipes-grid" id="resultsGrid"></div>
                </section>
            </div>
        </div>
    </main>
</body>
</html>
